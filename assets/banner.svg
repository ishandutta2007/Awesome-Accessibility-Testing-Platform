<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  
  <!-- Decorative Grid -->
  <g opacity="0.07">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300 M 0,350 L 1200,350" stroke="#ffffff" stroke-width="1" />
    <path d="M 100,0 L 100,400 M 200,0 L 200,400 M 300,0 L 300,400 M 400,0 L 400,400 M 500,0 L 500,400 M 600,0 L 600,400 M 700,0 L 700,400 M 800,0 L 800,400 M 900,0 L 900,400 M 1000,0 L 1000,400 M 1100,0 L 1100,400" stroke="#ffffff" stroke-width="1" />
  </g>

  <!-- Glowing Abstract Shapes -->
  <circle cx="1050" cy="100" r="120" fill="#a855f7" opacity="0.15" filter="url(#glow)" />
  <circle cx="150" cy="300" r="180" fill="#0ea5e9" opacity="0.1" filter="url(#glow)" />

  <!-- Accessibility Symbol (Stylized wheelchair user / universal access figure) -->
  <g transform="translate(100, 100) scale(1.8)" filter="url(#glow)">
    <!-- Outer Ring -->
    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10 5 20 5" />
    <!-- Head -->
    <circle cx="50" cy="28" r="7" fill="url(#accentGrad)" />
    <!-- Torso / Arms -->
    <path d="M 35,42 Q 50,38 65,42 M 50,42 L 50,62" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
    <!-- Legs (sitting/wheelchair shape) -->
    <path d="M 42,75 Q 50,68 58,75" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Main Title -->
  <text x="320" y="190" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" fill="url(#accentGrad)" letter-spacing="1.5">
    AWESOME ACCESSIBILITY
  </text>
  
  <!-- Subtitle -->
  <text x="320" y="245" font-family="'Inter', sans-serif" font-size="28" font-weight="500" fill="#cbd5e1" letter-spacing="1">
    Testing Platforms &amp; Open-Source Tools
  </text>

  <!-- Status / Decorative Badges inside SVG -->
  <g transform="translate(320, 285)">
    <rect width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="55" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">AUTOMATED</text>
    
    <g transform="translate(125, 0)">
      <rect width="90" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="45" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#a855f7" text-anchor="middle">MANUAL</text>
    </g>

    <g transform="translate(230, 0)">
      <rect width="110" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="55" y="18" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#f43f5e" text-anchor="middle">COMPLIANCE</text>
    </g>
  </g>
</svg>
